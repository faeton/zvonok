# zvonok — realtime path (redis + livekit-server + livekit-sip + voice-agent)
# plus the phase-2 product spine (postgres + call-api).
#
# Deployed on de1 only (BRIEF §3). Everything runs on HOST networking: livekit-sip
# needs the 10000-20000/udp RTP range, which is unusable through docker port
# mapping, and once one service is on the host network the others must be too in
# order to reach it on loopback. The consequence is that each service is
# responsible for binding narrowly itself — see the bind addresses below.
#
# Secrets come from .env (git-ignored, lives on de1 only). See .env.example.

# Docker's default json-file driver has NO size limit. de1 is a shared host and
# SIP logging is verbose (every INVITE, every retransmit from the carrier), so an
# unbounded log is a slow disk-fill affecting every other service on the box.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# One voice worker per TENANT (billing account). Everything account-specific —
# SIP trunk, xAI key, caller identity — is in the worker's own env and never
# travels through dispatch metadata, which is persisted in Redis and logged.
# What follows is only the part every worker shares.
x-agent: &agent
  build:
    context: ../agent
  image: zvonok-agent:phase1
  restart: unless-stopped
  logging: *logging
  network_mode: host
  depends_on:
    - livekit
  # Shared deliberately: files are named by job id, and the janitor needs one
  # place to look when an agent's HTTP callback never lands (BRIEF §9 trap 4).
  volumes:
    - ./transcripts:/data/transcripts
  command: ["python", "-u", "agent.py", "start"]

x-agent-env: &agent-env
  LIVEKIT_URL: ws://127.0.0.1:7880
  # Shared by every tenant's worker, because there is one LiveKit. This is a
  # room-admin credential, so a tenant's worker could in principle join another
  # tenant's room — the trust boundary that per-tenant DIDs and keys do not
  # close. Acceptable between people who know each other; not between strangers.
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
  ZVONOK_TRANSCRIPT_DIR: /data/transcripts
  ZVONOK_OUTPUT_GAIN: ${ZVONOK_OUTPUT_GAIN:-1.4}
  # Phase 2: report call outcomes to call-api. Unset these and the agent behaves
  # exactly as it did in phase 1 (dispatch by hand, transcript to a file), which
  # keeps the manual debugging path usable.
  ZVONOK_API_URL: http://${ZVONOK_BIND_HOST}:${ZVONOK_API_PORT}
  ZVONOK_INTERNAL_TOKEN: ${ZVONOK_INTERNAL_TOKEN}

services:
  redis:
    image: redis:7-alpine
    container_name: zvonok-redis
    restart: unless-stopped
    logging: *logging
    # --bind 127.0.0.1 is load-bearing, not decoration: on host networking the
    # image's default would listen on every interface, and the only thing
    # standing between that and the internet would be the nftables drop policy.
    # Every consumer (livekit-server, livekit-sip) is host-networked too, so
    # loopback is all they need (BRIEF §5.2: Redis is never exposed).
    command: ["redis-server", "--bind", "127.0.0.1", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    network_mode: host
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  livekit:
    # Pinned. `latest` on the media path means an upstream release can silently
    # change SIP signalling, room lifecycle or codec behaviour on the next pull —
    # on a service where behaviour changes cost money. These are the versions
    # verified in BRIEF §9 phase 1.
    image: livekit/livekit-server:v1.13.4
    container_name: zvonok-livekit
    restart: unless-stopped
    logging: *logging
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      # Rendered from livekit.yaml by deploy.sh with the real keys substituted —
      # livekit.yaml itself stays placeholder-only so it is safe to commit.
      - ./livekit.rendered.yaml:/etc/livekit.yaml:ro

  sip:
    # Pinned by digest: livekit/sip publishes no v1.8.0 tag, and this is the
    # exact image that phase 1 was validated against.
    image: livekit/sip@sha256:ad8dafcbde3327883d03c50684bb7004f626b3a2d055a2dfe18973dab91f9536
    container_name: zvonok-sip
    restart: unless-stopped
    logging: *logging
    network_mode: host
    depends_on:
      - livekit
    environment:
      # Full YAML inline — the documented way to configure this image.
      SIP_CONFIG_BODY: |
        api_key: '${LIVEKIT_API_KEY}'
        api_secret: '${LIVEKIT_API_SECRET}'
        ws_url: 'ws://127.0.0.1:7880'
        redis:
          address: '127.0.0.1:6379'
        sip_port: 5060
        rtp_port: 10000-20000
        use_external_ip: true
        logging:
          # info, not debug: debug logs every RTP/ICE internal on a shared host.
          # Raise to debug deliberately when diagnosing a SIP problem.
          level: info

  agent:
    <<: *agent
    container_name: zvonok-agent
    environment:
      <<: *agent-env
      # The tenant routing key. call-api dispatches to a NAME, and that name
      # decides whose trunk and whose voice-brain key place the call.
      ZVONOK_AGENT_NAME: ${ZVONOK_AGENT_NAME:-zvonok-caller}
      ZVONOK_AGENT_PORT: ${ZVONOK_AGENT_PORT:-18130}
      XAI_API_KEY: ${XAI_API_KEY}
      SIP_OUTBOUND_TRUNK_ID: ${SIP_OUTBOUND_TRUNK_ID}
      # The worker re-checks any caller ID the API hands it against this list.
      ZVONOK_OWNED_CALLER_IDS: ${ZVONOK_OWNED_CALLER_IDS:-}
      # Identity spoken on the call. The _RU variants exist for pronunciation:
      # the model reads Cyrillic correctly on a Russian call, Latin it does not.
      ZVONOK_OWNER_NAME: ${ZVONOK_OWNER_NAME:-}
      ZVONOK_OWNER_NAME_RU: ${ZVONOK_OWNER_NAME_RU:-}
      ZVONOK_OWNER_NAME_RU_GEN: ${ZVONOK_OWNER_NAME_RU_GEN:-}
      ZVONOK_OWNER_FULLNAME: ${ZVONOK_OWNER_FULLNAME:-}
      ZVONOK_OWNER_FULLNAME_RU: ${ZVONOK_OWNER_FULLNAME_RU:-}
      ZVONOK_ASSISTANT_NAME: ${ZVONOK_ASSISTANT_NAME}
      ZVONOK_ASSISTANT_NAME_RU: ${ZVONOK_ASSISTANT_NAME_RU}
      ZVONOK_ASSISTANT_NAME_PL: ${ZVONOK_ASSISTANT_NAME_PL:-}
      # Contact numbers the agent may hand out mid-call.
      ZVONOK_BOOKING_PHONE: ${ZVONOK_BOOKING_PHONE:-}
      ZVONOK_MESSENGER_PHONE: ${ZVONOK_MESSENGER_PHONE:-}
      ZVONOK_MESSENGER_PHONE_NOTE: ${ZVONOK_MESSENGER_PHONE_NOTE:-}

  # A second billing account on the same box: their Zadarma trunk, their xAI
  # key, their DIDs, their spoken identity. Nothing of theirs is in the service
  # above, and nothing of ours is here — the two share LiveKit, Postgres and the
  # host, and that is the whole of the overlap.
  #
  # Off by default. Enable with COMPOSE_PROFILES="tenant2" in .env (deploy.sh
  # runs a plain `docker compose up`, and compose reads that variable from .env),
  # and set ZVONOK_TENANT_<IDENTITY>="tenant2" so call-api routes to it.
  #
  # ⚠ Two things here MUST differ from the service above or calls land on the
  # wrong account: ZVONOK_AGENT_NAME (the dispatch key) and ZVONOK_AGENT_PORT
  # (host networking means the worker's debug server binds the real host port —
  # a collision is fatal at startup, which is the good outcome; the bad one is
  # a duplicated agent name, which fails silently by succeeding).
  agent-tenant2:
    <<: *agent
    container_name: zvonok-agent-tenant2
    profiles: ["tenant2"]
    environment:
      <<: *agent-env
      ZVONOK_AGENT_NAME: ${ZVONOK_AGENT_NAME_TENANT2:-}
      ZVONOK_AGENT_PORT: ${ZVONOK_AGENT_PORT_TENANT2:-18132}
      # Overrides the anchor's shared token. Without this line the worker
      # authenticates as the DEFAULT tenant at the internal endpoints, so its
      # calls would settle against the wrong account and its transcripts would
      # be extracted with the wrong xAI key — and call-api would have no way to
      # tell, because the token is the only thing it has to go on.
      ZVONOK_INTERNAL_TOKEN: ${ZVONOK_INTERNAL_TOKEN_TENANT2:-}
      XAI_API_KEY: ${XAI_API_KEY_TENANT2:-}
      SIP_OUTBOUND_TRUNK_ID: ${SIP_OUTBOUND_TRUNK_ID_TENANT2:-}
      ZVONOK_OWNED_CALLER_IDS: ${ZVONOK_OWNED_CALLER_IDS_TENANT2:-}
      ZVONOK_OWNER_NAME: ${ZVONOK_OWNER_NAME_TENANT2:-}
      ZVONOK_OWNER_NAME_RU: ${ZVONOK_OWNER_NAME_RU_TENANT2:-}
      ZVONOK_OWNER_NAME_RU_GEN: ${ZVONOK_OWNER_NAME_RU_GEN_TENANT2:-}
      ZVONOK_OWNER_FULLNAME: ${ZVONOK_OWNER_FULLNAME_TENANT2:-}
      ZVONOK_OWNER_FULLNAME_RU: ${ZVONOK_OWNER_FULLNAME_RU_TENANT2:-}
      ZVONOK_ASSISTANT_NAME: ${ZVONOK_ASSISTANT_NAME_TENANT2:-Klava}
      ZVONOK_ASSISTANT_NAME_RU: ${ZVONOK_ASSISTANT_NAME_RU_TENANT2:-Клава}
      ZVONOK_ASSISTANT_NAME_PL: ${ZVONOK_ASSISTANT_NAME_PL_TENANT2:-}
      ZVONOK_BOOKING_PHONE: ${ZVONOK_BOOKING_PHONE_TENANT2:-}
      ZVONOK_MESSENGER_PHONE: ${ZVONOK_MESSENGER_PHONE_TENANT2:-}
      ZVONOK_MESSENGER_PHONE_NOTE: ${ZVONOK_MESSENGER_PHONE_NOTE_TENANT2:-}

  postgres:
    image: postgres:17-alpine
    container_name: zvonok-postgres
    restart: unless-stopped
    logging: *logging
    network_mode: host
    environment:
      POSTGRES_USER: zvonok
      POSTGRES_DB: zvonok
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Loopback only, for the same reason as redis: on host networking there is
    # no docker-proxy and no published-port scoping to hide behind, and the job
    # table is the audit record for a spend-capable actuator (BRIEF §5.2).
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U zvonok"]
      interval: 10s
      timeout: 3s
      retries: 10

  call-api:
    build:
      context: ../api
    image: zvonok-api:phase2
    container_name: zvonok-call-api
    restart: unless-stopped
    logging: *logging
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    # call-api is the ONE service that legitimately needs every tenant's config
    # — it resolves caller IDs, caps and the extraction key for all of them. The
    # per-tenant and per-identity variables are suffixed (XAI_API_KEY_TENANT2,
    # ZVONOK_DAILY_USD_FRIEND, …), so enumerating them here would mean editing
    # this file every time a tenant or a token is added, and forgetting a line
    # fails silently by falling back to a default. The explicit block below
    # still documents what matters and takes precedence over the file.
    #
    # Note this is call-api only. A worker must NEVER get the whole file: that
    # would put every tenant's SIP trunk and voice-brain key in every tenant's
    # process (see the x-agent-env anchor).
    env_file:
      - .env
    environment:
      ZVONOK_DATABASE_URL: postgresql://zvonok:${POSTGRES_PASSWORD}@127.0.0.1:5432/zvonok
      ZVONOK_API_TOKENS: ${ZVONOK_API_TOKENS}
      ZVONOK_INTERNAL_TOKEN: ${ZVONOK_INTERNAL_TOKEN}
      ZVONOK_WEBHOOK_SECRET: ${ZVONOK_WEBHOOK_SECRET}
      LIVEKIT_HTTP_URL: http://127.0.0.1:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      XAI_API_KEY: ${XAI_API_KEY}
      ZVONOK_EXTRACTOR_MODEL: ${ZVONOK_EXTRACTOR_MODEL:-grok-latest}
      # Caller-ID policy (deployment data, never hard-coded — see .env.example).
      ZVONOK_OWNED_CALLER_IDS: ${ZVONOK_OWNED_CALLER_IDS:-}
      ZVONOK_DEFAULT_CALLER_ID: ${ZVONOK_DEFAULT_CALLER_ID:-}
      ZVONOK_CALLER_ID_BY_COUNTRY: ${ZVONOK_CALLER_ID_BY_COUNTRY:-}
      ZVONOK_TRANSCRIPT_DIR: /data/transcripts
      ZVONOK_MAX_CONCURRENT_CALLS: ${ZVONOK_MAX_CONCURRENT_CALLS:-2}
      ZVONOK_DAILY_CALLS: ${ZVONOK_DAILY_CALLS:-40}
      ZVONOK_DAILY_MINUTES: ${ZVONOK_DAILY_MINUTES:-60}
      ZVONOK_DAILY_USD: ${ZVONOK_DAILY_USD:-10}
    volumes:
      # Read-only. This is the fallback half of at-least-once transcript
      # delivery: an agent whose HTTP callback never lands still leaves a file
      # here, and the janitor reconciles from it (BRIEF §9 phase-2 trap 4).
      - ./transcripts:/data/transcripts:ro
    # Bound to the TAILNET address, not 0.0.0.0. This API places calls that cost
    # money; it has no public surface at all, and does not depend on the
    # firewall staying correct to keep it that way (decided 2026-07-27).
    command:
      - uvicorn
      - zvonok_api.main:app
      - --host
      - ${ZVONOK_BIND_HOST}
      - --port
      - ${ZVONOK_API_PORT}

volumes:
  redis_data:
  pg_data:
